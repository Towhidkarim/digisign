<link rel="stylesheet" href="../../tokens.css"><script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||"light")</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-subtle)}
.ico{width:36px;height:36px;border-radius:var(--radius-md);background:var(--surface-subtle);display:grid;place-items:center;color:var(--ink-muted)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.t{font:600 15px/22px var(--font-sans);margin:0}
.m{font:400 13px/20px var(--font-sans);color:var(--ink-muted);margin:2px 0 0}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:var(--radius-full);font:500 12px/16px var(--font-sans)}
.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}.brand{background:var(--brand-bg);color:var(--brand-fg)}.success{background:var(--success-bg);color:var(--success-fg)}
.prog{display:flex;gap:3px;margin-top:8px}.prog i{width:28px;height:4px;border-radius:2px;background:var(--brand-soft)}.prog i.on{background:var(--brand)}
.when{font:400 12px/16px var(--font-sans);color:var(--ink-subtle)}
</style>
<div class="card">
<div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></div>
<div><p class="t">Service agreement.pdf</p><p class="m">Waiting on Maria Okafor</p><div class="prog"><i class="on"></i><i></i><i></i></div></div>
<div class="right"><span class="badge brand">Out for signature</span><span class="when">3 hours ago</span></div></div>
<div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></div>
<div><p class="t">NDA, Northwind.pdf</p><p class="m">Signed by 2 of 2 signers</p></div>
<div class="right"><span class="badge success">Completed</span><span class="when">12 Sep 2026</span></div></div>
<div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></div>
<div><p class="t">Offer letter draft.pdf</p><p class="m">No signers added yet</p></div>
<div class="right"><span class="badge neutral">Draft</span><span class="when">Yesterday</span></div></div>
</div>
