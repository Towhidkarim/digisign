<!-- @dsCard group="Status" height=150 subtitle="Six document states, each with icon and word" -->
<link rel="stylesheet" href="../../tokens.css"><script>document.documentElement.setAttribute("data-theme",new URLSearchParams(location.search).get("theme")||"light")</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:var(--radius-full);font-size:12px;font-weight:500;line-height:16px}
.badge svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
.brand{background:var(--brand-bg);color:var(--brand-fg)}
.success{background:var(--success-bg);color:var(--success-fg)}
.danger{background:var(--danger-bg);color:var(--danger-fg)}
.warning{background:var(--warning-bg);color:var(--warning-fg)}
</style>
<div class="row">
<span class="badge neutral"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Draft</span>
<span class="badge brand"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>Out for signature</span>
<span class="badge success"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Completed</span>
<span class="badge danger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>Declined</span>
<span class="badge neutral"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>Voided</span>
<span class="badge warning"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Expired</span>
</div>
